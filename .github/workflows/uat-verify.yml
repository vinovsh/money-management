name: Verify built UAT APK
on:
  push:
    branches: [uat, main]
    paths: [scripts/android-smoke.py, .github/workflows/uat-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Walletway-Android-APK
          path: dist
          run-id: 38062286670
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify existing APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SOURCE_APK: dist/Walletway-0.4.1.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Walletway-UAT-Verification
          path: |
            dist/*.xml
            dist/*.png
            dist/*.log
