apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
react { autolinkLibrariesWithApp() }
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.moneywise"
    defaultConfig {
        applicationId "com.moneywise"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "0.6.0"
    }
    testBuildType "release"
    signingConfigs {
        release {
            storeFile file(System.getenv("MONEYWISE_KEYSTORE") ?: "moneywise-dev.keystore")
            storePassword System.getenv("MONEYWISE_STORE_PASSWORD") ?: "moneywise-local-build"
            keyAlias System.getenv("MONEYWISE_KEY_ALIAS") ?: "moneywise"
            keyPassword System.getenv("MONEYWISE_KEY_PASSWORD") ?: "moneywise-local-build"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.release }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("androidx.work:work-runtime:2.9.1")
    implementation("com.google.android.gms:play-services-auth:21.2.0")
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:core:1.6.1")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("com.google.guava:guava:31.1-android")
}
